
name: Build CleanMyTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          for file in ./*.zip; do
            if [ -f "$file" ]; then
              unzip -oq "$file" -d extracted
            fi
          done

      - name: Locate Android project
        id: project
        run: |
          PROJECT_DIR="$(find extracted . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ไม่พบ settings.gradle ใน ZIP หรือ Repository"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_DIR")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanMyTV-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
